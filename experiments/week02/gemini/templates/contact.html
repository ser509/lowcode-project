<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .error { color: #d9534f; background-color: #f2dede; padding: 10px; border: 1px solid #ebccd1; margin-bottom: 15px; max-width: 400px; border-radius: 4px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        textarea { height: 120px; }
        button { padding: 10px 15px; background-color: #0275d8; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #025aa5; }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    
    <!-- Display visible error message if validation fails -->
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/contact">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ name }}">
        </div>
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="text" id="email" name="email" value="{{ email }}">
        </div>
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message">{{ message }}</textarea>
        </div>
        <button type="submit">Send Message</button>
    </form>
</body>
</html>
