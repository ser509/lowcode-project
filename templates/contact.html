<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font: inherit; }
    button { margin-top: 20px; padding: 10px 20px; font: inherit; cursor: pointer; }
    .errors { background: #fdecea; border: 1px solid #d93025; color: #a50e0e; padding: 8px 16px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Contact Us</h1>

  {% if errors %}
    <div class="errors" role="alert">
      <ul>
        {% for error in errors %}
          <li>{{ error }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}

  <form method="post" action="/contact">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ name }}" required>

    <label for="email">Email address</label>
    <input type="email" id="email" name="email" value="{{ email }}" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required>{{ message }}</textarea>

    <button type="submit">Send</button>
  </form>
</body>
</html>
